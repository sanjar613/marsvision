<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Темный фон со скругленными углами -->
  <rect width="100" height="100" rx="22" fill="#14161e"/>
  <!-- Красная линза / Марс -->
  <circle cx="50" cy="50" r="24" fill="#ff4757"/>
  <!-- Рамки фокуса камеры (левый верх) -->
  <path d="M 22 40 L 22 22 L 40 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Рамки фокуса камеры (правый верх) -->
  <path d="M 78 40 L 78 22 L 60 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Рамки фокуса камеры (левый низ) -->
  <path d="M 22 60 L 22 78 L 40 78" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Рамки фокуса камеры (правый низ) -->
  <path d="M 78 60 L 78 78 L 60 78" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
